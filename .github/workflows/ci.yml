name: CI

on:
  push:
    branches: [master]
  # Sin filtro de rama base: los PRs apilados (base = otra rama de feature)
  # también corren CI.
  pull_request:

jobs:
  # Gate: valida los mensajes de commit contra Conventional Commits antes de
  # gastar tiempo instalando dependencias o corriendo tests. Reusa los tipos
  # permitidos definidos en .pre-commit-config.yaml.
  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conventional-pre-commit
        run: pip install conventional-pre-commit
      - name: Validate commit messages
        env:
          TYPES: "feat fix docs refactor test chore build ci style perf revert"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commits=$(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          else
            commits="HEAD"
          fi
          if [ -z "$commits" ]; then
            echo "No commits to validate."
            exit 0
          fi
          for sha in $commits; do
            echo "Checking $sha: $(git log -1 --format=%s "$sha")"
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            conventional-pre-commit $TYPES /tmp/commit-msg
          done

  # Solo corre si el gate de mensajes pasó.
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    needs: commit-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # uv va pinneado: la herramienta que resuelve el entorno también forma
      # parte de lo que hay que reproducir. El intérprete lo fija
      # backend/.python-version, así que CI y local usan el mismo Python.
      # setup-uv dejó de publicar tag mayor móvil después de v7: v8 y v9 solo
      # existen como semver completo, así que @v9 no resuelve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.17"
          enable-cache: true
          working-directory: backend
      # `--locked` no resuelve nada: instala exactamente lo que dice uv.lock y
      # falla si el lock quedó desfasado de pyproject.toml. Es lo que evita que
      # un release nuevo en PyPI (p. ej. mcp 2.0) entre solo en un build.
      - name: Install backend (dev) from the lock file
        run: uv sync --locked --all-extras
      # --no-sync: el paso anterior ya preparó el entorno.
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Pytest
        run: uv run --no-sync pytest

  # Backend Java (ADR 0011). Convive con el de Python hasta el corte y los dos
  # escriben la misma base, así que acá también corre el test de interop
  # (PythonInteropTest), que necesita el entorno de backend/.
  java-test:
    name: Java build & test
    runs-on: ubuntu-latest
    needs: commit-lint
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.17"
          enable-cache: true
          working-directory: backend
      - name: Install python backend for the interop test
        working-directory: backend
        run: uv sync --locked --all-extras
      - name: Maven verify
        env:
          LIFEOS_PYTHON_BACKEND: ${{ github.workspace }}/backend
        run: ./mvnw -B verify

  # Librerías JavaScript del tablero de Quickshell (desktop/omarchy-plugin/lib):
  # sin dependencias, con el runner de tests de node. El QML en sí se prueba
  # a mano o con desktop/tests/qml/run_board.py (necesita PySide6 y EGL).
  desktop-js:
    name: Desktop board JS
    runs-on: ubuntu-latest
    needs: commit-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        run: node --test desktop/tests/*.test.mjs

  # App Android (android/, módulo único `app`). El runner de ubuntu ya trae el
  # SDK (ANDROID_HOME). El APK release se firma con el keystore de los secrets;
  # la versión sale del número de corrida.
  android:
    name: Android build & test
    runs-on: ubuntu-latest
    needs: commit-lint
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew --console=plain test assembleDebug
      # Falla claro si falta el secret (p. ej. PRs desde forks).
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LIFEOS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFEOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFEOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LIFEOS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty: secrets are unavailable (fork PR?) or not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$LIFEOS_KEYSTORE_FILE"
          ./gradlew --console=plain assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Siempre borra el keystore decodificado.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
