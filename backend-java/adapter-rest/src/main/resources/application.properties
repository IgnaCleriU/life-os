spring.application.name=lifeos
# Mismo puerto que el adapter FastAPI: los clientes no cambian de URL.
server.port=8000
# Contrato JSON del adapter Python: campos en snake_case.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Vacío = la ruta compartida por defecto (DATABASE_URL o XDG, ver DatabaseLocation).
lifeos.database-url=
