spring.application.name=lifeos
# Mismo puerto que el adapter FastAPI: los clientes no cambian de URL.
server.port=8000
# Loopback por defecto. Con la guardia de token (ADR 0012) el contenedor puede
# escuchar en 0.0.0.0 (LIFEOS_BIND_ADDRESS), pero el puerto publicado debe
# seguir atado a 127.0.0.1 en el host.
server.address=${LIFEOS_BIND_ADDRESS:127.0.0.1}
# Contrato JSON del adapter Python: campos en snake_case.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Vacío = la ruta compartida por defecto (DATABASE_URL o XDG, ver DatabaseLocation).
lifeos.database-url=
# Guardia de la API (ADR 0009/0012), mismas variables que el backend Python:
# enabled (por defecto) o disabled; token Bearer; hosts extra separados por coma.
lifeos.api.auth=${LIFEOS_API_AUTH:enabled}
lifeos.api.token=${LIFEOS_API_TOKEN:}
lifeos.api.allowed-hosts=${LIFEOS_ALLOWED_HOSTS:}
