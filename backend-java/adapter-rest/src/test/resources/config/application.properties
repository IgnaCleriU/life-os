# Default de los tests: una ruta inutilizable. Un test que olvide el override
# (RestTestSupport#databaseUrl) falla al arrancar en vez de abrir la base real.
lifeos.database-url=jdbc:sqlite:/proc/lifeos-tests-must-override-database-url/lifeos.db
# La guardia queda encendida con un token fijo (RestTestSupport lo manda en cada
# request); no depende de LIFEOS_API_* del entorno de quien corre los tests.
lifeos.api.auth=enabled
lifeos.api.token=test-token
lifeos.api.allowed-hosts=
