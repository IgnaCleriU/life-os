# Override de docker-compose para un VPS. Se enlaza (symlink) en la raíz del
# repo como `docker-compose.override.yml` (compose lo carga solo) y deja la API escuchando
# únicamente en loopback: desde afuera se llega por túnel SSH o, con el perfil
# `public`, por HTTPS a través de Caddy (ADR 0013). El 8000 nunca se publica
# directo.
#
# La API publicada es la de Java. El backend de Python está deprecado y en el
# VPS no corre: queda detrás del perfil `python`, que nunca se activa ahí, así
# no ocupa RAM. `!reset` vacía la lista del compose base y `!override` la
# reemplaza en vez de sumarse a ella (requiere Docker Compose >= 2.24).
services:
  backend:
    profiles: [python]
    ports: !reset []
  backend-java:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  # Opt-in: `COMPOSE_PROFILES=public` y `LIFEOS_PUBLIC_HOST=<dominio>` en el
  # `.env`. Sin el perfil, este servicio no se crea.
  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    profiles: [public]
    depends_on: [backend-java]
    ports:
      - "443:443"
    environment:
      LIFEOS_PUBLIC_HOST: ${LIFEOS_PUBLIC_HOST:-}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y cuenta ACME: sin volumen, cada recreación del contenedor
      # pediría un certificado nuevo y chocaría con los límites de Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
  # Monitor de recursos Beszel (ADR 0014), servido por Caddy en /monitor/.
  # Opt-in con el perfil `monitor`. Antes de activarlo, BESZEL_USER_EMAIL y
  # BESZEL_USER_PASSWORD en el `.env`: el hub crea esa cuenta al arrancar por
  # primera vez, así la pantalla de "crear admin" nunca queda abierta a
  # internet. Sin puertos publicados: Caddy llega por la red de compose.
  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    profiles: [monitor]
    environment:
      APP_URL: https://${LIFEOS_PUBLIC_HOST:-localhost}/monitor
      USER_EMAIL: ${BESZEL_USER_EMAIL:-}
      USER_PASSWORD: ${BESZEL_USER_PASSWORD:-}
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    restart: unless-stopped
  # El agente escucha en un socket compartido y el hub se conecta a él por SSH
  # con su clave (BESZEL_AGENT_KEY, la pública del hub); no hace falta token.
  # Red del host para medir sus interfaces. El socket de Docker, aunque sea de
  # solo lectura, le da acceso equivalente a root (ver ADR 0014).
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    profiles: [monitor]
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY:-}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  beszel-data:
  beszel-socket:
  beszel-agent-data:
