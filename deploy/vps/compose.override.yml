# Override de docker-compose para un VPS. Se enlaza (symlink) en la raíz del
# repo como `docker-compose.override.yml` (compose lo carga solo) y deja la API escuchando
# únicamente en loopback: desde afuera se llega por túnel SSH o por Tailscale
# Serve, nunca por un puerto público.
#
# La API publicada es la de Java. El contenedor de Python sigue
# corriendo —MCP entra por `docker compose exec backend lifeos-mcp`— pero sin
# publicar ningún puerto. `!reset` vacía la lista del compose base y `!override`
# la reemplaza en vez de sumarse a ella (requiere Docker Compose >= 2.24).
services:
  backend:
    ports: !reset []
    restart: unless-stopped
  backend-java:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
