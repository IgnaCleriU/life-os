# Override de docker-compose para un VPS. Se copia a la raíz del repo como
# `docker-compose.override.yml` (compose lo carga solo) y deja la API escuchando
# únicamente en loopback: desde afuera se llega por túnel SSH, nunca por un
# puerto público. `!override` reemplaza la lista de puertos del compose base en
# vez de sumarse a ella (requiere Docker Compose >= 2.24).
services:
  backend:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
